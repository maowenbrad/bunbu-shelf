<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{block "title" .}}bunbu-shelf{{end}}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen font-sans antialiased">

  <!-- Nav -->
  <nav class="border-b border-neutral-800 px-6 py-3">
    <div class="max-w-7xl mx-auto flex items-center gap-6">
      <a href="/" class="font-serif text-lg font-semibold text-neutral-100 tracking-tight">bunbu-shelf</a>
      <div class="flex items-center gap-4 text-sm text-neutral-400">
        <a href="/shelf" class="hover:text-neutral-100 transition-colors">Shelf</a>
        <a href="/search" class="hover:text-neutral-100 transition-colors">Search</a>
        <a href="/themes" class="hover:text-neutral-100 transition-colors">Themes</a>
        <a href="/log" class="hover:text-neutral-100 transition-colors">Log</a>
      </div>
      <div class="ml-auto">
        <a href="/settings" class="text-sm text-neutral-500 hover:text-neutral-300 transition-colors">Settings</a>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <main class="max-w-7xl mx-auto px-6 py-8">
    {{block "content" .}}{{end}}
  </main>

</body>
</html>
