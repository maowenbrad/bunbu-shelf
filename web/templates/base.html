<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{block "title" .}}bunbu-shelf{{end}}</title>
  <!-- Apply the saved theme before first paint to avoid a flash -->
  <script>
    (function () {
      var t = localStorage.getItem("theme");
      if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body class="bg-ice dark:bg-night text-ink dark:text-ice min-h-screen font-sans antialiased flex flex-col">

  <header class="bg-ink text-white sticky top-0 z-50 shadow-md shadow-ink/10 dark:border-b dark:border-white/10">
    <div class="max-w-screen-xl mx-auto px-6 h-14 flex items-center gap-5 md:gap-8">
      <!-- Wordmark -->
      <a href="/" class="text-lg font-bold tracking-tight select-none whitespace-nowrap">
        bunbu<span class="text-cyan">-</span>shelf
      </a>

      <!-- Nav links -->
      <nav class="flex items-center gap-4 md:gap-6 text-sm font-medium text-white/70">
        <a href="/shelf"  class="hover:text-cyan transition-colors">Shelf</a>
        <a href="/search" class="hover:text-cyan transition-colors">Search</a>
        <a href="/themes" class="hover:text-cyan transition-colors">Themes</a>
        <a href="/log"    class="hover:text-cyan transition-colors">Log</a>
      </nav>

      <!-- Library search -->
      <form method="GET" action="/search" class="ml-auto hidden md:block">
        <input
          type="search" name="q" placeholder="Search your library…"
          class="w-56 lg:w-72 bg-white/10 border border-white/15 rounded-full px-4 py-1.5 text-sm text-white placeholder-white/40
                 focus:outline-none focus:bg-white/15 focus:border-cyan transition-colors"
        >
      </form>

      <!-- Theme toggle: moon in light mode, sun in dark mode -->
      <button id="theme-toggle" type="button" aria-label="Toggle dark mode"
              class="ml-auto md:ml-0 text-white/50 hover:text-cyan transition-colors">
        <svg class="w-5 h-5 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="w-5 h-5 hidden dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>

      <a href="/settings" class="text-sm text-white/50 hover:text-cyan transition-colors">Settings</a>
    </div>
  </header>

  <main class="flex-1 w-full max-w-screen-xl mx-auto px-6 py-10">
    {{block "content" .}}{{end}}
  </main>

  <footer class="border-t border-line dark:border-night-3 mt-10">
    <div class="max-w-screen-xl mx-auto px-6 py-6 text-xs text-fog-light">
      bunbu-shelf · a local-first library — your books live as plain markdown files
    </div>
  </footer>

  <script>
    document.getElementById("theme-toggle").addEventListener("click", function () {
      var dark = document.documentElement.classList.toggle("dark");
      localStorage.setItem("theme", dark ? "dark" : "light");
    });
  </script>

</body>
</html>
