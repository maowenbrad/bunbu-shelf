{{template "base.html" .}}

{{define "title"}}Themes{{end}}

{{define "content"}}
<div class="space-y-6 max-w-3xl">
  <h1 class="text-2xl font-bold text-ink dark:text-ice">Themes</h1>

  {{if .Themes}}
  <div class="flex flex-wrap gap-2">
    {{range .Themes}}
    <a href="/shelf?theme={{.Theme}}" class="flex items-center gap-2 px-3.5 py-1.5 bg-white dark:bg-night-2 border border-line dark:border-night-3 rounded-full text-sm shadow-sm hover:border-teal dark:hover:border-cyan transition-colors group">
      <span class="font-medium text-ink dark:text-ice group-hover:text-teal-dark dark:group-hover:text-cyan transition-colors">{{.Theme}}</span>
      <span class="text-xs font-semibold text-fog dark:text-fog-light bg-mist dark:bg-night-3 rounded-full px-1.5 py-0.5">{{.Count}}</span>
    </a>
    {{end}}
  </div>
  {{else}}
  <p class="text-fog dark:text-fog-light">No themes yet. Add some to your books.</p>
  {{end}}

</div>
{{end}}
