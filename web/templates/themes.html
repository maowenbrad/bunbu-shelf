{{template "base.html" .}}

{{define "title"}}Themes{{end}}

{{define "content"}}
<div class="space-y-6 max-w-3xl">
  <h1 class="text-2xl font-bold text-ink">Themes</h1>

  {{if .Themes}}
  <div class="flex flex-wrap gap-2">
    {{range .Themes}}
    <a href="/shelf?theme={{.Theme}}" class="flex items-center gap-2 px-3.5 py-1.5 bg-white border border-line rounded-full text-sm shadow-sm hover:border-teal transition-colors group">
      <span class="font-medium text-ink group-hover:text-teal-dark transition-colors">{{.Theme}}</span>
      <span class="text-xs font-semibold text-fog bg-mist rounded-full px-1.5 py-0.5">{{.Count}}</span>
    </a>
    {{end}}
  </div>
  {{else}}
  <p class="text-fog">No themes yet. Add some to your books.</p>
  {{end}}

</div>
{{end}}
